<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Asistencia Escolar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<!-- LOGIN -->
<div id="login-panel" class="max-w-sm mx-auto mt-20 bg-white p-6 rounded-xl shadow">
  <h2 class="text-xl font-bold text-center mb-4">🔐 Iniciar sesión</h2>

  <form id="login-form" class="space-y-3">
    <input id="user" placeholder="Usuario" class="w-full p-2 border rounded" required>
    <input id="pass" type="password" placeholder="Contraseña" class="w-full p-2 border rounded" required>

    <button class="w-full bg-blue-600 text-white p-3 rounded font-bold">
      Entrar
    </button>
  </form>

  <p id="login-msg" class="text-center text-sm mt-3"></p>
</div>

<!-- APP -->
<div id="app" class="hidden max-w-4xl mx-auto p-4">

  <h1 class="text-2xl font-bold text-center mb-6">
    📚 Registro de Asistencia Escolar
  </h1>

  <!-- FORM -->
  <form id="attendance-form" class="bg-white p-4 rounded-xl shadow space-y-3">
    <input type="date" id="date" class="w-full p-2 border rounded" required>

    <select id="level" class="w-full p-2 border rounded" required>
      <option value="">Seleccione nivel</option>
      <option>Inicial</option>
      <option>1° Grado</option>
      <option>2° Grado</option>
      <option>3° Grado</option>
      <option>4° Grado</option>
      <option>5° Grado</option>
      <option>6° Grado</option>
      <option>7° Grado</option>
      <option>8° Grado</option>
      <option>9° Grado</option>
      <option>10° Grado</option>
      <option>11° Grado</option>
    </select>

    <div class="grid grid-cols-2 gap-2">
      <input type="number" id="girlsP" placeholder="Niñas presentes" class="p-2 border rounded" value="0">
      <input type="number" id="boysP" placeholder="Niños presentes" class="p-2 border rounded" value="0">
    </div>

    <input id="teacher" placeholder="Docente" class="w-full p-2 border rounded">

    <textarea id="obs" placeholder="Observaciones" class="w-full p-2 border rounded"></textarea>

    <button class="w-full bg-green-600 text-white p-3 rounded font-bold">
      Guardar asistencia
    </button>

    <p id="form-msg" class="text-center text-sm font-bold"></p>
  </form>

  <!-- HISTORIAL -->
  <div class="mt-6">
    <h2 class="font-bold mb-2">📋 Historial</h2>
    <div id="history" class="space-y-2"></div>
  </div>

</div>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDjkCjj1iLMi3Z22o6cj1Xa-yYDoqjBm04",
  authDomain: "base-de-datos-san-ignacio.firebaseapp.com",
  projectId: "base-de-datos-san-ignacio",
  storageBucket: "base-de-datos-san-ignacio.appspot.com",
  messagingSenderId: "698408506523",
  appId: "1:698408506523:web:ede2c739a1920e8956a23e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
console.log("✅ Firebase conectado");

/* ================= LOGIN LOCAL ================= */
const loginForm = document.getElementById("login-form");

loginForm.addEventListener("submit", e => {
  e.preventDefault();

  if (user.value === "admin" && pass.value === "1234") {
    localStorage.setItem("login", "ok");
    login-panel.classList.add("hidden");
    app.classList.remove("hidden");
    loadHistory();
  } else {
    login-msg.textContent = "❌ Usuario o contraseña incorrectos";
    login-msg.className = "text-red-600";
  }
});

if (localStorage.getItem("login") === "ok") {
  login-panel.classList.add("hidden");
  app.classList.remove("hidden");
  loadHistory();
}

/* ================= GUARDAR ================= */
attendance-form.addEventListener("submit", async e => {
  e.preventDefault();

  try {
    await db.collection("attendance").add({
      date: date.value,
      level: level.value,
      girls_present: Number(girlsP.value),
      boys_present: Number(boysP.value),
      teacher: teacher.value,
      observations: obs.value,
      created_at: firebase.firestore.FieldValue.serverTimestamp()
    });

    form-msg.textContent = "✅ Guardado correctamente";
    form-msg.className = "text-green-600";
    attendance-form.reset();
    loadHistory();

  } catch (err) {
    console.error(err);
    form-msg.textContent = "❌ Error al guardar";
    form-msg.className = "text-red-600";
  }
});

/* ================= HISTORIAL ================= */
async function loadHistory() {
  history.innerHTML = "";

  const snap = await db.collection("attendance")
    .orderBy("created_at", "desc")
    .limit(20)
    .get();

  snap.forEach(doc => {
    const d = doc.data();
    history.innerHTML += `
      <div class="bg-white p-3 rounded shadow text-sm">
        <strong>${d.level}</strong> – ${d.date}<br>
        👧 ${d.girls_present} | 👦 ${d.boys_present}<br>
        👨‍🏫 ${d.teacher || "Sin nombre"}
      </div>`;
  });
}
</script>

</body>
</html>
